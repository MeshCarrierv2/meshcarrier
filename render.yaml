services:
  - type: web
    name: meshcarrier-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LIVE_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: meshcarrier-db
          property: connectionString
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: USER_EMAIL
        sync: false
      - key: USER_PASSWORD
        sync: false
      - key: USER_NAME
        sync: false

databases:
  - name: meshcarrier-db
    databaseName: meshcarrier
    user: meshcarrier
    plan: free
