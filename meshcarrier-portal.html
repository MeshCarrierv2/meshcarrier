    <div>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search by name, DID, email, ID…"
        style={{width:'100%',background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:7,padding:'8px 13px',color:C.white,fontSize:12,outline:'none',marginBottom:10,fontFamily:'var(--sans)'}}/>
      <div className="panel tbl-wrap">
        <PH title={`Subscribers (${filt.length})`}/>
        <table><thead><tr>{['ID','Name','DID','Plan','eSIM','Voice','SMS','Status','Actions'].map(h=><th key={h}>{h}</th>)}</tr></thead>
          <tbody>{filt.map(s=><tr key={s.id} onClick={()=>setSel(s===sel?null:s)} style={{cursor:'pointer',background:sel?.id===s.id?C.blue+'08':''}}>
            <td style={{fontFamily:'var(--mono)',fontSize:10}}>{s.id.slice(0,8)}</td>
            <td>{s.full_name||'—'}</td>
            <td style={{fontFamily:'var(--mono)',fontSize:11}}>{s.did||s.msisdn||'—'}</td>
            <td><Bdg label={s.plan} color={s.plan==='CARRIER'?C.yellow:s.plan==='MESH'?C.green:C.blue}/></td>
            <td><Dot s={s.esim_status}/>{s.esim_status}</td>
            <td><Dot s={s.voice}/>{s.voice}</td>
            <td><Dot s={s.sms}/>{s.sms}</td>
            <td><Dot s={s.account_status}/>{s.account_status}</td>
            <td onClick={e=>e.stopPropagation()}>
              <div style={{display:'flex',gap:3}}>
                <Btn size="xs" outline color={C.red} onClick={()=>act(s.id,'suspend')}>SUSP</Btn>
                <Btn size="xs" outline color={C.green} onClick={()=>act(s.id,'activate')}>ACT</Btn>
              </div>
            </td>
          </tr>)}</tbody>
        </table>
      </div>
    </div>
    {sel&&<div className="panel" style={{height:'fit-content'}}>
      <PH title="Detail" right={<button type="button" onClick={()=>setSel(null)} style={{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:18}}>×</button>}/>
      <div style={{padding:'4px 16px 12px'}}>
        {[['Plan',sel.plan],['eSIM',sel.esim_status],['Voice',sel.voice],['SMS',sel.sms],['Account',sel.account_status],['DID',sel.did||'—'],['Data',sel.data_limit_gb===-1?'Unlimited':`${sel.data_used_gb}/${sel.data_limit_gb}GB`],['MESH',sel.mesh_balance],['Voicemail',sel.voicemail_count+' msgs']].map(([k,v])=><DR key={k} k={k} v={String(v)}/>)}
        <div className="g2" style={{marginTop:12}}>
          <Btn full size="sm" outline color={C.red} onClick={()=>act(sel.id,'suspend')}>SUSPEND</Btn>
          <Btn full size="sm" outline color={C.green} onClick={()=>act(sel.id,'activate')}>ACTIVATE</Btn>
        </div>
      </div>
    </div>}
  </div>;
}


function DevicesMgr({show}) {
  const [devs,setDevs] = useState([]);
  const [sel,setSel] = useState(null);
  const [steps,setSteps] = useState([]);
  const [modal,setModal] = useState(null);
  const [swp,setSwp] = useState({make:'',model:'',os_version:'',imei:'',esim_eid:''});
  const reload=()=>api('/devices').then(setDevs).catch(()=>{});
  useEffect(()=>{reload();api('/devices/setup-steps').then(setSteps).catch(()=>{});}, []);
  const loadDev=async d=>{const f=await api('/devices/'+d.id);setSel(f);};
  const advance=async id=>{
    try{const u=await api('/devices/'+id+'/step',{method:'PATCH',body:{}});setSel(u);await reload();show('Step advanced: '+(u.current_step?.name||'Done'));}
    catch(e){show(e.message,C.red);}
  };
  const setStepTo=async(id,s)=>{
    try{const u=await api('/devices/'+id+'/step',{method:'PATCH',body:{step:s}});setSel(u);show('Step set to '+s);}
    catch(e){show(e.message,C.red);}
  };
  const [qrData,setQrData] = useState(null);
  const reissue=async()=>{
    try{
      // Check if Gigs integration is configured
      const subId = sel.subscriber_id;
      if(!subId){show('No subscriber linked to this device',C.red);return;}
      show('Provisioning eSIM via Gigs...',C.cyan);
      let result;
      try{
        result = await api('/esim/reissue/'+subId,{method:'POST',body:{}});
      }catch(e){
        // Gigs not configured — fall back to mock
        if(e.message.includes('not set')||e.message.includes('not configured')){
          const iccid='890115027800000'+Math.floor(10000+Math.random()*90000);
          await api('/devices/'+sel.id+'/step',{method:'PATCH',body:{step:2,status:'setup',notes:'eSIM reissued (mock) — ICCID: '+iccid}});
          await api('/subscribers/'+subId,{method:'PATCH',body:{esim_status:'pending',voice:'pending',sms:'pending'}});
          await reload();const f=await api('/devices/'+sel.id);setSel(f);setModal(null);
          show('eSIM reissued (mock mode — configure Gigs API for live).');
          return;
        }
        throw e;
      }
      await reload();const f=await api('/devices/'+sel.id);setSel(f);
      if(result.qr_code_url||result.activation_code){
        setQrData(result);setModal('qr');
      }else{
        setModal(null);
        show(result.pending?'eSIM provisioning started — will complete shortly.':'eSIM reissued successfully!',C.green);
      }
    }catch(e){show(e.message,C.red);}
  };
  const doSwap=async()=>{
    if(!swp.make||!swp.model){show('Make and model required',C.red);return;}
    try{
      const sid=sel.subscriber_id||(await api('/devices/'+sel.id))?.subscriber_id;
      if(!sid){show('No subscriber linked',C.red);return;}
      await api('/devices/'+sel.id,{method:'PATCH',body:{status:'replaced',setup_notes:'Replaced via device swap — '+new Date().toLocaleDateString()}});
      const nDev=await api('/devices',{method:'POST',body:{...swp,subscriber_id:sid}});
      await api('/subscribers/'+sid,{method:'PATCH',body:{esim_status:'pending',voice:'pending',sms:'pending'}});
      await reload();const f=await api('/devices/'+nDev.id);setSel(f);setModal(null);
      setSwp({make:'',model:'',os_version:'',imei:'',esim_eid:''});
      show('Device swapped! New device at Step 0.');
    }catch(e){show(e.message,C.red);}
  };
  return <div>
    <div style={{display:'grid',gridTemplateColumns:sel?'1fr 340px':'1fr',gap:12}}>
      <div className="panel tbl-wrap"><PH title="Device Management"/>
        <table><thead><tr>{['Device','Subscriber','IMEI','Status','Setup',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
          <tbody>{devs.map(d=><tr key={d.id} onClick={()=>loadDev(d)} style={{cursor:'pointer',background:sel?.id===d.id?C.blue+'08':''}}>
            <td><div style={{fontWeight:600}}>{d.make} {d.model}</div><div style={{fontSize:10,color:C.muted}}>{d.os_version}</div></td>
            <td><div>{d.full_name||'—'}</div><div style={{fontFamily:'var(--mono)',fontSize:10,color:C.muted}}>{d.did||'No DID'}</div></td>
            <td style={{fontFamily:'var(--mono)',fontSize:10}}>{d.imei||'—'}</td>
            <td><Dot s={d.status}/>{d.status}</td>
            <td>
              <div style={{fontFamily:'var(--mono)',fontSize:11,color:d.status==='replaced'?C.muted:C.blue,marginBottom:2}}>{d.setup_step}/9</div>
              <div className="prog-track" style={{width:50}}><div className="prog-fill" style={{width:`${d.setup_step/9*100}%`,background:d.status==='replaced'?C.muted:C.blue}}/></div>
            </td>
            <td style={{fontFamily:'var(--mono)',fontSize:9,color:C.muted}}>{d.id.slice(0,8)}</td>
          </tr>)}</tbody>
        </table>
      </div>

      {sel&&<div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div className="panel">
          <PH title={`${sel.make} ${sel.model}`} right={<button type="button" onClick={()=>setSel(null)} style={{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:18}}>×</button>}/>
          <div style={{padding:'4px 16px 12px'}}>
            {[['Owner',sel.full_name||'—'],['DID',sel.did||'Not assigned'],['Plan',sel.plan||'—'],['IMEI',sel.imei||'—'],['eSIM EID',sel.esim_eid||'—'],['eSIM',sel.esim_status||'—'],['Voice',sel.voice||'—'],['SMS',sel.sms||'—'],['Status',sel.status]].map(([k,v])=><DR key={k} k={k} v={v}/>)}
            {sel.status!=='replaced'&&<div className="g2" style={{marginTop:12}}>
              <Btn full size="sm" outline color={C.cyan} onClick={()=>setModal('esim')}>REISSUE eSIM</Btn>
              <Btn full size="sm" outline color={C.purple} onClick={()=>setModal('swap')}>DEVICE SWAP</Btn>
            </div>}
            {sel.status==='replaced'&&<div style={{marginTop:10,padding:'8px 10px',background:C.muted+'15',border:`1px solid ${C.muted}30`,borderRadius:5,fontSize:11,color:C.muted}}>⚠ Device replaced — no longer active.</div>}
          </div>
        </div>

        <div className="panel"><PH title={`Setup Wizard — ${sel.setup_step}/9`}/>
          <div style={{padding:'12px 16px'}}>
            <div className="prog-track" style={{marginBottom:10}}><div className="prog-fill" style={{width:`${sel.setup_step/9*100}%`,background:`linear-gradient(90deg,${C.blue},${C.cyan})`}}/></div>
            <div style={{maxHeight:220,overflowY:'auto',marginBottom:10,display:'flex',flexDirection:'column',gap:3}}>
              {(sel.setup_steps||steps).map((s,i)=>{const done=i<sel.setup_step,cur=i===sel.setup_step;return(
                <div key={i} onClick={()=>setStepTo(sel.id,i)} className={`vstep ${done?'done':cur?'cur':''} ${sel.status==='replaced'?'rep':''}`}>
                  <div className="snum" style={{background:done?C.green:cur?C.blue:'var(--bg3)',color:done||cur?'#000':C.muted,border:`1px solid ${done?C.green:cur?C.blue:'var(--border2)'}`}}>{done?'✓':i}</div>
                  <div>
                    <div style={{fontSize:11,color:cur?C.blue:done?C.green:C.text,fontWeight:cur?600:400}}>{s.name}</div>
                    {cur&&<div style={{fontSize:10,color:C.muted,marginTop:1}}>{s.description}</div>}
                  </div>
                </div>
              );})}
            </div>
            {sel.setup_step<9&&sel.status!=='replaced'
              ?<Btn full color={C.cyan} onClick={()=>advance(sel.id)}>ADVANCE → {(sel.setup_steps||steps)[sel.setup_step+1]?.name||'Complete'}</Btn>
              :sel.status!=='replaced'&&<div style={{padding:9,background:C.green+'15',border:`1px solid ${C.green}40`,borderRadius:6,textAlign:'center',color:C.green,fontWeight:700,fontSize:12}}>✓ FULLY PROVISIONED</div>}
          </div>
        </div>
      </div>}
    </div>

    {modal==='esim'&&sel&&<Modal title="REISSUE eSIM PROFILE" onClose={()=>setModal(null)} color={C.cyan}>
      <div className="info-box" style={{background:C.cyan+'10',border:`1px solid ${C.cyan}25`,marginBottom:14}}>
        <div style={{color:C.cyan,fontWeight:600,fontSize:9,letterSpacing:1,marginBottom:5}}>WHAT THIS DOES</div>
        1. Cancels current eSIM profile on SM-DP+ server<br/>
        2. Generates new ICCID and activation code<br/>
        3. Resets device to Step 2 in setup wizard<br/>
        4. Subscriber must scan new QR code
      </div>
      <div style={{marginBottom:14}}>{[['Device',`${sel.make} ${sel.model}`],['Subscriber',sel.full_name||'—'],['Current ICCID',sel.iccid||'—'],['eSIM EID',sel.esim_eid||'—']].map(([k,v])=><DR key={k} k={k} v={v}/>)}</div>
      <div className="info-box" style={{background:C.orange+'10',border:`1px solid ${C.orange}30`,color:C.orange,marginBottom:14,fontSize:11}}>⚠ Old eSIM profile stops working immediately. Subscriber must download new profile.</div>
      <div className="g2"><Btn full outline color={C.muted} onClick={()=>setModal(null)}>CANCEL</Btn><Btn full color={C.cyan} onClick={reissue}>REISSUE eSIM</Btn></div>
    </Modal>}

    {modal==='qr'&&qrData&&<Modal title="ESIM ACTIVATION" onClose={()=>{setModal(null);setQrData(null);}} color={C.green} width={500}>
      <div className="info-box" style={{background:C.green+'10',border:`1px solid ${C.green}25`,marginBottom:16}}>
        <div style={{color:C.green,fontWeight:700,fontSize:9,letterSpacing:1,marginBottom:5}}>✓ eSIM PROVISIONED VIA GIGS</div>
        The subscriber can now activate their eSIM using the QR code or activation code below.
      </div>
      {qrData.qr_code_url&&<div style={{textAlign:'center',marginBottom:14}}>
        <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:8,textTransform:'uppercase'}}>Scan QR Code</div>
        <img src={qrData.qr_code_url} alt="eSIM QR Code" style={{width:160,height:160,borderRadius:8,border:`1px solid ${C.border2}`}}/>
      </div>}
      {qrData.activation_code&&<div style={{marginBottom:12}}>
        <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:5,textTransform:'uppercase'}}>Manual Activation Code</div>
        <div style={{fontFamily:'var(--mono)',fontSize:10,background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:6,padding:'8px 12px',wordBreak:'break-all',color:C.cyan}}>{qrData.activation_code}</div>
      </div>}
      {qrData.apple_link&&<div style={{marginBottom:12}}>
        <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:5,textTransform:'uppercase'}}>Apple One-Tap Install</div>
        <a href={qrData.apple_link} target="_blank" style={{display:'block',padding:'8px 12px',background:C.blue+'15',border:`1px solid ${C.blue}30`,borderRadius:6,color:C.blue,fontSize:11,textDecoration:'none',textAlign:'center'}}>Open on iPhone →</a>
      </div>}
      {qrData.iccid&&<div style={{marginBottom:14}}><DR k="ICCID" v={qrData.iccid}/></div>}
      <div style={{padding:'8px 11px',background:C.yellow+'10',border:`1px solid ${C.yellow}25`,borderRadius:6,fontSize:11,color:C.yellow,marginBottom:14}}>
        ⚠ Share this QR code with the subscriber. It can only be used once.
      </div>
      <div className="g2">
        <Btn full outline color={C.muted} onClick={()=>{setModal(null);setQrData(null);}}>CLOSE</Btn>
        <Btn full color={C.green} onClick={()=>navigator.clipboard?.writeText(qrData.activation_code||'').then(()=>show('Copied!'))}>COPY CODE</Btn>
      </div>
    </Modal>}

    {modal==='swap'&&sel&&<Modal title="DEVICE SWAP" onClose={()=>setModal(null)} color={C.purple} width={500}>
      <div className="info-box" style={{background:C.purple+'10',border:`1px solid ${C.purple}25`,marginBottom:14}}>
        <div style={{color:C.purple,fontWeight:600,fontSize:9,letterSpacing:1,marginBottom:5}}>WHAT THIS DOES</div>
        1. Marks current device as REPLACED<br/>
        2. Registers new device under same subscriber<br/>
        3. Resets eSIM / Voice / SMS to pending<br/>
        4. Starts setup wizard from Step 0
      </div>
      <div style={{padding:'8px 12px',background:'var(--bg3)',borderRadius:6,fontSize:11,marginBottom:14}}>
        <span style={{color:C.muted}}>Replacing: </span><b>{sel.make} {sel.model}</b><span style={{color:C.muted}}> for </span><span style={{color:C.blue}}>{sel.full_name||'subscriber'}</span>
      </div>
      <div className="g2"><F label="Make" value={swp.make} onChange={v=>setSwp(p=>({...p,make:v}))} placeholder="e.g. Apple"/><F label="Model" value={swp.model} onChange={v=>setSwp(p=>({...p,model:v}))} placeholder="e.g. iPhone 16"/></div>
      <F label="OS Version" value={swp.os_version} onChange={v=>setSwp(p=>({...p,os_version:v}))} placeholder="e.g. iOS 18"/>
      <F label="IMEI" value={swp.imei} onChange={v=>setSwp(p=>({...p,imei:v}))} placeholder="15-digit IMEI"/>
      <F label="eSIM EID (optional)" value={swp.esim_eid} onChange={v=>setSwp(p=>({...p,esim_eid:v}))} placeholder="32-digit EID"/>
      <div className="g2"><Btn full outline color={C.muted} onClick={()=>setModal(null)}>CANCEL</Btn><Btn full color={C.purple} onClick={doSwap}>SWAP DEVICE</Btn></div>
    </Modal>}
  </div>;
}


function TicketsMgr({show}) {
  const {user} = useAuth();
  const [tickets,setTickets] = useState([]);
  const [active,setActive] = useState(null);
  const [filt,setFilt] = useState('open');
  const [reply,setReply] = useState('');
  const chatRef = useRef(null);
  useEffect(()=>{api('/tickets').then(setTickets).catch(()=>{});}, []);
  const openTkt=async t=>{const f=await api('/tickets/'+t.id);setActive(f);setTimeout(()=>{if(chatRef.current)chatRef.current.scrollTop=99999;},100);};
  const sendReply=async()=>{
    if(!reply.trim()||!active)return;
    try{const m=await api('/tickets/'+active.id+'/messages',{method:'POST',body:{body:reply}});setActive(p=>({...p,messages:[...p.messages,m]}));setReply('');setTimeout(()=>{if(chatRef.current)chatRef.current.scrollTop=99999;},50);}
    catch(e){show(e.message,C.red);}
  };
  const resolve=async id=>{
    await api('/tickets/'+id,{method:'PATCH',body:{status:'resolved'}});
    setActive(p=>({...p,status:'resolved'}));const f=await api('/tickets');setTickets(f);show('Ticket resolved');
  };
  const shown=tickets.filter(t=>filt==='all'||t.status===filt);
  return <div style={{display:'grid',gridTemplateColumns:'220px 1fr',gap:12,height:'74vh'}}>
    <div className="panel" style={{overflow:'hidden',display:'flex',flexDirection:'column'}}>
      <div style={{padding:8,borderBottom:'1px solid var(--border)',display:'flex',gap:3,flexShrink:0}}>
        {['open','resolved','all'].map(f=><button key={f} type="button" onClick={()=>setFilt(f)}
          style={{flex:1,padding:'5px',background:filt===f?C.blue:'transparent',border:`1px solid ${filt===f?C.blue:'var(--border2)'}`,borderRadius:4,color:filt===f?'#000':C.muted,fontSize:9,fontWeight:700,cursor:'pointer',letterSpacing:1,textTransform:'uppercase'}}>{f}</button>)}
      </div>
      <div style={{overflowY:'auto',flex:1}}>
        {shown.map(t=><div key={t.id} onClick={()=>openTkt(t)} style={{padding:'10px 12px',borderBottom:'1px solid var(--border)',cursor:'pointer',background:active?.id===t.id?C.blue+'08':'transparent',borderLeft:`3px solid ${sc(t.priority)}`}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
            <span style={{fontFamily:'var(--mono)',fontSize:9,color:C.muted}}>{t.id.slice(0,8)}</span>
            <Bdg label={t.priority} color={sc(t.priority)}/>
          </div>
          <div style={{fontSize:11,color:C.white,marginBottom:3,lineHeight:1.3}}>{t.subject}</div>
          <div style={{display:'flex',gap:5,alignItems:'center'}}>
            <Bdg label={t.category} color={C.muted}/>
            <span style={{fontSize:9,color:C.muted}}>{t.user_name}</span>
          </div>
        </div>)}
      </div>
    </div>
    {active?<div className="panel" style={{display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
        <div>
          <div style={{display:'flex',gap:6,marginBottom:4}}><Bdg label={active.status} color={sc(active.status)}/><Bdg label={active.priority} color={sc(active.priority)}/><Bdg label={active.category} color={C.muted}/></div>
          <div style={{fontSize:14,fontWeight:600}}>{active.subject}</div>
          <div style={{fontSize:10,color:C.muted,marginTop:2}}>{active.user_name} · {active.created_at?.slice(0,10)}</div>
        </div>
        {active.status==='open'&&<Btn size="sm" outline color={C.green} onClick={()=>resolve(active.id)}>RESOLVE</Btn>}
      </div>
      <div ref={chatRef} className="chat-wrap">
        {active.messages?.map((m,i)=>{const isStaff=['support','tech','admin','superadmin'].includes(m.role);return(
          <div key={i} className={`cmsg ${isStaff?'me':''}`}>
            <div className="cav" style={{background:ROLE_C[m.role]||C.blue}}>{m.role?.[0]}</div>
            <div>
              <div className="cmeta" style={{textAlign:isStaff?'right':'left'}}>{m.full_name} · {m.created_at?.slice(11,16)}</div>
              <div className="cbub" style={{background:isStaff?C.blue+'18':'var(--bg3)',border:`1px solid ${isStaff?C.blue+'30':'var(--border2)'}`,borderRadius:isStaff?'10px 2px 10px 10px':'2px 10px 10px 10px'}}>{m.body}</div>
            </div>
          </div>
        );})}
      </div>
      {active.status==='open'&&<div style={{padding:'10px 14px',borderTop:'1px solid var(--border)',display:'flex',gap:8,flexShrink:0}}>
        <input value={reply} onChange={e=>setReply(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendReply()} placeholder="Reply… (Enter to send)"
          style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:6,padding:'8px 12px',color:C.white,fontSize:12,outline:'none',fontFamily:'var(--sans)'}}/>
        <Btn color={C.blue} onClick={sendReply}>SEND</Btn>
      </div>}
    </div>:<div style={{display:'flex',alignItems:'center',justifyContent:'center',color:C.muted,fontSize:13}}>Select a ticket to view</div>}
  </div>;
}

  return <div>

    </div>
    {tab==='calls'&&<div className="panel tbl-wrap"><table>
      <thead><tr>{['Sub','Direction','From','To','Duration','Status','Time'].map(h=><th key={h}>{h}</th>)}</tr></thead>
      <tbody>{calls.map(c=><tr key={c.id}>
        <td style={{fontFamily:'var(--mono)',fontSize:10}}>{c.sub_id?.slice(0,8)}</td>
        <td><span style={{color:c.direction==='inbound'?C.cyan:C.purple,fontWeight:700,fontSize:11}}>{c.direction==='inbound'?'↙ IN':'↗ OUT'}</span></td>
        <td style={{fontFamily:'var(--mono)',fontSize:11}}>{c.from_num}</td>
        <td style={{fontFamily:'var(--mono)',fontSize:11}}>{c.to_num}</td>
        <td style={{fontFamily:'var(--mono)'}}>{fmt(c.duration_s)}</td>
        <td><Dot s={c.status}/>{c.status}</td>
        <td style={{color:C.muted}}>{c.created_at?.slice(11,19)}</td>
      </tr>)}</tbody>
    </table></div>}
    {tab==='sms'&&<div className="panel tbl-wrap"><table>
      <thead><tr>{['Sub','Direction','From','To','Body','Status'].map(h=><th key={h}>{h}</th>)}</tr></thead>
      <tbody>{sms.map(s=><tr key={s.id}>
        <td style={{fontFamily:'var(--mono)',fontSize:10}}>{s.sub_id?.slice(0,8)}</td>
        <td><span style={{color:s.direction==='inbound'?C.cyan:C.purple,fontWeight:700,fontSize:11}}>{s.direction==='inbound'?'↙ IN':'↗ OUT'}</span></td>
        <td style={{fontFamily:'var(--mono)',fontSize:11}}>{s.from_num}</td>
        <td style={{fontFamily:'var(--mono)',fontSize:11}}>{s.to_num}</td>
        <td style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',color:C.text}}>{s.body}</td>
        <td><Dot s={s.status}/>{s.status}</td>
      </tr>)}</tbody>
    </table></div>}
    {tab==='numbers'&&<div className="panel tbl-wrap"><table>
      <thead><tr>{['Number','City','Type','Provider','$/Mo','Status'].map(h=><th key={h}>{h}</th>)}</tr></thead>
      <tbody>{dids.map(d=><tr key={d.number}>
        <td style={{fontFamily:'var(--mono)',color:C.cyan}}>{d.number}</td>
        <td>{d.city}</td>
        <td><Bdg label={d.type} color={d.type==='tollfree'?C.purple:C.muted}/></td>
        <td style={{color:C.text}}>{d.provider}</td>
        <td style={{fontFamily:'var(--mono)'}}>${d.monthly_usd}</td>
        <td><Dot s={d.status}/>{d.status}</td>
      </tr>)}</tbody>
    </table></div>}
    {tab==='porting'&&<div style={{display:'flex',flexDirection:'column',gap:10}}>
      {ports.map(p=><div key={p.id} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderLeft:`3px solid ${sc(p.status)}`,borderRadius:10,padding:16}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
          <div><div style={{fontFamily:'var(--mono)',fontSize:16,color:C.cyan,fontWeight:700}}>{p.number}</div><div style={{fontSize:11,color:C.muted}}>Carrier: {p.carrier_losing}</div></div>
          <Bdg label={p.status.replace('_',' ')} color={sc(p.status)}/>
        </div>
        <div style={{fontSize:12,color:C.text}}>{p.notes}</div>
      </div>)}
      {!ports.length&&<div style={{color:C.muted,fontSize:12,textAlign:'center',padding:32}}>No porting requests</div>}
    </div>}
  </div>;
}


function PaymentsMgr({show}) {
  const [pmts,setPmts] = useState([]);
  const [subs,setSubs] = useState([]);
  const [modal,setModal] = useState(null);
  const [sel,setSel] = useState(null);
  const [form,setForm] = useState({sub_id:'',amount_xrp:'',amount_usd:'',note:'',plan:''});
  const reload=()=>api('/payments').then(setPmts).catch(()=>{});
  useEffect(()=>{reload();api('/subscribers').then(setSubs).catch(()=>{});}, []);
  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const totalXrp=pmts.filter(p=>p.status==='settled').reduce((a,p)=>a+p.amount_xrp,0);
  const totalUsd=pmts.filter(p=>p.status==='settled'&&p.amount_usd).reduce((a,p)=>a+(p.amount_usd||0),0);
  const TC={credit:C.green,charge:C.orange,refund:C.yellow,plan_purchase:C.blue,manual:C.purple};
  const MODS={
    credit:{title:'ADD CREDIT',color:C.green,info:'Credits added to subscriber account.',btn:'ADD CREDIT'},
    charge:{title:'MANUAL CHARGE',color:C.orange,info:'Apply a charge for overages or add-ons.',btn:'APPLY CHARGE'},
    manual:{title:'LOG PAYMENT',color:C.purple,info:'Log a payment made outside the system.',btn:'LOG PAYMENT'},
    refund:{title:'ISSUE REFUND',color:C.yellow,info:'Issue a standalone refund to subscriber.',btn:'ISSUE REFUND'},
  };
  const doSubmit=async type=>{
    if(!form.sub_id||!form.amount_xrp){show('Subscriber and amount required',C.red);return;}
    try{
      await api('/payments',{method:'POST',body:{sub_id:form.sub_id,type,plan:form.plan||null,amount_xrp:parseFloat(form.amount_xrp),amount_usd:form.amount_usd?parseFloat(form.amount_usd):null,status:type==='refund'?'refunded':'settled'}});
      await reload();setModal(null);setForm({sub_id:'',amount_xrp:'',amount_usd:'',note:'',plan:''});show(type+' recorded');
    }catch(e){show(e.message,C.red);}
  };
  const issueRefund=async p=>{
    try{await api('/payments',{method:'POST',body:{sub_id:p.sub_id,type:'refund',amount_xrp:p.amount_xrp,amount_usd:p.amount_usd,plan:p.plan,status:'refunded'}});await reload();setSel(null);show('Refund issued');}
    catch(e){show(e.message,C.red);}
  };
  return <div>
    <div className="g5" style={{marginBottom:14}}>
      <SC label="Total XRP" value={totalXrp.toFixed(1)} color={C.green}/>
      <SC label="Total USD" value={'$'+totalUsd.toFixed(0)} color={C.cyan}/>
      <SC label="Transactions" value={pmts.length} color={C.blue}/>
      <SC label="Settled" value={pmts.filter(p=>p.status==='settled').length} color={C.green}/>
      <SC label="Refunded" value={pmts.filter(p=>p.status==='refunded').length} color={C.orange}/>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
      <Btn size="sm" color={C.green} onClick={()=>setModal('credit')} icon="＋">ADD CREDIT</Btn>
      <Btn size="sm" outline color={C.orange} onClick={()=>setModal('charge')} icon="＋">MANUAL CHARGE</Btn>
      <Btn size="sm" outline color={C.purple} onClick={()=>setModal('manual')} icon="＋">LOG PAYMENT</Btn>
      <Btn size="sm" outline color={C.yellow} onClick={()=>setModal('refund')} icon="＋">ISSUE REFUND</Btn>
    </div>
    <div className="panel tbl-wrap">
      <table><thead><tr>{['Date','Subscriber','Type','Plan','XRP','USD','Status','NFT',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
        <tbody>{pmts.map(p=><tr key={p.id} onClick={()=>setSel(p===sel?null:p)} style={{cursor:'pointer',background:sel?.id===p.id?C.blue+'08':''}}>
          <td style={{color:C.muted}}>{p.created_at?.slice(0,10)}</td>
          <td>{p.full_name||'—'}</td>
          <td><Bdg label={(p.type||'').replace(/_/g,' ')} color={TC[p.type]||C.muted}/></td>
          <td>{p.plan?<Bdg label={p.plan} color={p.plan==='CARRIER'?C.yellow:C.blue}/>:'—'}</td>
          <td style={{fontFamily:'var(--mono)',color:p.status==='refunded'?C.orange:C.cyan}}>{p.status==='refunded'?'-':''}{p.amount_xrp}</td>
          <td>{p.amount_usd?'$'+p.amount_usd:'—'}</td>
          <td><Dot s={p.status}/>{p.status}</td>
          <td style={{fontFamily:'var(--mono)',fontSize:9,color:C.muted}}>{p.nft_id?.slice(0,10)||'—'}</td>
          <td onClick={e=>e.stopPropagation()}>{p.status==='settled'&&<Btn size="xs" outline color={C.yellow} onClick={()=>issueRefund(p)}>REFUND</Btn>}</td>
        </tr>)}</tbody>
      </table>
    </div>
    {sel&&<div style={{marginTop:10,background:'var(--bg2)',border:`1px solid ${TC[sel.type]||'var(--border)'}40`,borderLeft:`3px solid ${TC[sel.type]||C.muted}`,borderRadius:10,padding:16}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
        <span style={{fontFamily:'var(--mono)',fontSize:9,color:C.muted,letterSpacing:2}}>PAYMENT — {sel.id?.slice(0,16)}</span>
        <button type="button" onClick={()=>setSel(null)} style={{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:16}}>×</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
        {[['Subscriber',sel.full_name||'—'],['Plan',sel.plan||'—'],['XRP',sel.amount_xrp],['USD',sel.amount_usd?'$'+sel.amount_usd:'—'],['Type',sel.type],['Status',sel.status],['Date',sel.created_at?.slice(0,16)],['NFT',sel.nft_id?.slice(0,12)||'—']].map(([k,v])=>(
          <div key={k} style={{background:'var(--bg3)',borderRadius:6,padding:'8px 10px'}}>
            <div style={{fontSize:9,color:C.muted,marginBottom:2}}>{k}</div>
            <div style={{fontFamily:'var(--mono)',fontSize:10,color:C.white}}>{v}</div>
          </div>
        ))}
      </div>
      {sel.status==='settled'&&<div style={{marginTop:10}}><Btn size="sm" outline color={C.yellow} onClick={()=>issueRefund(sel)}>ISSUE REFUND</Btn></div>}
    </div>}
    {modal&&MODS[modal]&&<Modal title={MODS[modal].title} onClose={()=>setModal(null)} color={MODS[modal].color}>
      <div className="info-box" style={{background:MODS[modal].color+'10',border:`1px solid ${MODS[modal].color}25`,marginBottom:14,color:MODS[modal].color}}>{MODS[modal].info}</div>
      <div className="field"><label className="flbl">Subscriber</label>
        <select className="fsel" value={form.sub_id} onChange={e=>sf('sub_id',e.target.value)}>
          <option value="">— Select subscriber —</option>
          {subs.map(s=><option key={s.id} value={s.id}>{s.full_name||s.email} ({s.did||s.id.slice(0,8)})</option>)}
        </select>
      </div>
      <div className="g2">
        <F label="Amount (XRP)" value={form.amount_xrp} onChange={v=>sf('amount_xrp',v)} placeholder="e.g. 13.0"/>
        <F label="Amount (USD)" value={form.amount_usd} onChange={v=>sf('amount_usd',v)} placeholder="e.g. 30"/>
      </div>
      <div className="field"><label className="flbl">Plan (optional)</label>
        <select className="fsel" value={form.plan} onChange={e=>sf('plan',e.target.value)}>
          <option value="">— None —</option>
          <option value="NODE">NODE ($15/mo)</option><option value="MESH">MESH ($30/mo)</option><option value="CARRIER">CARRIER ($55/mo)</option>
        </select>
      </div>
      <F label="Note (optional)" value={form.note} onChange={v=>sf('note',v)} placeholder="Reason for this transaction…"/>
      <div className="g2"><Btn full outline color={C.muted} onClick={()=>setModal(null)}>CANCEL</Btn><Btn full color={MODS[modal].color} onClick={()=>doSubmit(modal)}>{MODS[modal].btn}</Btn></div>
    </Modal>}
  </div>;
}


function NodesMgr({show}){
  const [nodes,setNodes]=useState([]);
  const [sel,setSel]=useState(null);
  const [modal,setModal]=useState(null);
  const [newForm,setNewForm]=useState({name:'',location:'',node_type:'relay'});
  const {toasts,show:toast}=useToast();

  const reload=async()=>{
    try{const d=await api('/nodes');setNodes(Array.isArray(d)?d:[]);}
    catch(e){toast(e.message,C.red);}
  };
  useEffect(()=>{reload();const t=setInterval(reload,10000);return()=>clearInterval(t);},[]);

  const reboot=async(id)=>{
    try{await api('/nodes/'+id+'/command',{method:'POST',body:{type:'reboot'}});toast('Reboot command sent',C.yellow);}
    catch(e){toast(e.message,C.red);}
  };

  const createNode=async()=>{
    try{
      const n=await api('/nodes',{method:'POST',body:newForm});
      toast('Node created — copy key now!',C.green);
      setSel({...n,node_key_visible:true});
      setModal('key');
      await reload();
    }catch(e){toast(e.message,C.red);}
  };

  const statusColor=s=>s==='online'?C.green:s==='degraded'?C.yellow:C.muted;
  const typeIcon=t=>({gnb:'📡',upf:'🔀',relay:'🔗',compute:'💻'}[t]||'▣');

  const onlineCount=nodes.filter(n=>n.status==='online').length;
  const totalClients=nodes.reduce((a,n)=>a+(n.connected_clients||0),0);
  const totalEarned=nodes.reduce((a,n)=>a+(n.mesh_earned||0),0);

  return <div>
    <ToastLayer toasts={toasts}/>
    <PH title="MESH NODES" action={<div style={{display:'flex',gap:8}}>
      <div style={{padding:'4px 10px',background:C.green+'15',border:`1px solid ${C.green}30`,borderRadius:5,fontSize:10,color:C.green}}>{onlineCount}/{nodes.length} ONLINE</div>
      <Btn small color={C.cyan} onClick={()=>setModal('new')}>+ REGISTER NODE</Btn>
    </div>}/>

    {/* Stats row */}
    <div className="g4" style={{marginBottom:14}}>
      <SC label="Online Nodes" value={onlineCount} sub={`of ${nodes.length} registered`} color={C.green}/>
      <SC label="Connected Clients" value={totalClients} sub="devices using network" color={C.blue}/>
      <SC label="Total MESH Earned" value={totalEarned.toFixed(3)} sub="across all nodes" color={C.purple}/>
      <SC label="Network Status" value={onlineCount>0?'LIVE':'OFFLINE'} sub={onlineCount>0?'serving traffic':'no active nodes'} color={onlineCount>0?C.green:C.muted}/>
    </div>

    {/* Node grid */}
    {nodes.length===0&&<div style={{padding:'28px',textAlign:'center',color:C.muted,fontSize:12,fontFamily:'var(--mono)',letterSpacing:1}}>
      NO NODES REGISTERED — Click REGISTER NODE to add your first device
    </div>}

    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10,marginBottom:14}}>
      {nodes.map(n=>{
        const isOn=n.status==='online';
        const hw=n.hardware||{};
        const stats=n.stats||{};
        return <div key={n.id} onClick={()=>setSel(n)}
          style={{padding:14,background:'var(--bg2)',border:`1px solid ${isOn?statusColor(n.status)+'40':'var(--border2)'}`,borderRadius:10,cursor:'pointer',transition:'all 0.15s',position:'relative',overflow:'hidden'}}>
          {/* Live pulse */}
          {isOn&&<div style={{position:'absolute',top:10,right:10,width:7,height:7,borderRadius:'50%',background:C.green,boxShadow:`0 0 6px ${C.green}`}}/>}
          {!isOn&&<div style={{position:'absolute',top:10,right:10,width:7,height:7,borderRadius:'50%',background:C.muted}}/>}

          <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:4}}>{typeIcon(n.node_type)} {(n.node_type||'relay').toUpperCase()} NODE</div>
          <div style={{fontWeight:700,fontSize:13,marginBottom:2,fontFamily:'var(--mono)',color:'var(--text)'}}>{n.name||n.id}</div>
          <div style={{fontSize:10,color:C.muted,marginBottom:10}}>{n.hostname||n.ip_address||n.location||'—'}</div>

          {/* Device type badge */}
          <div style={{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>
            {n.device_type&&<span style={{padding:'2px 7px',background:C.blue+'15',border:`1px solid ${C.blue}25`,borderRadius:4,fontSize:9,color:C.blue,letterSpacing:1}}>{(n.device_type||'').replace('_',' ').toUpperCase()}</span>}
            {hw.has_sdr&&<span style={{padding:'2px 7px',background:C.cyan+'15',border:`1px solid ${C.cyan}25`,borderRadius:4,fontSize:9,color:C.cyan,letterSpacing:1}}>SDR</span>}
            {n.radio_enabled&&<span style={{padding:'2px 7px',background:C.green+'15',border:`1px solid ${C.green}25`,borderRadius:4,fontSize:9,color:C.green,letterSpacing:1}}>RADIO ON</span>}
          </div>

          {/* Stats */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4}}>
            {[
              ['CPU', isOn?(n.cpu_percent||0)+'%':'—'],
              ['RAM', isOn?(n.ram_percent||0)+'%':'—'],
              ['Clients', isOn?(n.connected_clients||0):'—'],
              ['Temp', n.temperature_c?n.temperature_c.toFixed(0)+'°C':'—'],
            ].map(([k,v])=><div key={k} style={{padding:'4px 7px',background:'var(--bg3)',borderRadius:5}}>
              <div style={{fontSize:8,color:C.muted,letterSpacing:1}}>{k}</div>
              <div style={{fontSize:11,fontFamily:'var(--mono)',color:isOn?'var(--text)':C.muted}}>{v}</div>
            </div>)}
          </div>

          <div style={{marginTop:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:9,color:C.purple,fontFamily:'var(--mono)'}}>{(n.mesh_earned||0).toFixed(3)} MESH earned</span>
            <Btn small outline color={C.yellow} onClick={e=>{e.stopPropagation();reboot(n.id);}}>REBOOT</Btn>
          </div>
        </div>;
      })}
    </div>

    {/* Node detail panel */}
    {sel&&<div style={{background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:10,padding:16,marginBottom:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div>
          <div style={{fontSize:9,color:C.muted,letterSpacing:2}}>{typeIcon(sel.node_type)} NODE DETAIL</div>
          <div style={{fontWeight:700,fontFamily:'var(--mono)',fontSize:15}}>{sel.name||sel.id}</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <Btn small color={C.cyan} onClick={()=>setModal('cmd')}>SEND COMMAND</Btn>
          <Btn small outline color={C.muted} onClick={()=>setSel(null)}>CLOSE</Btn>
        </div>
      </div>
      <div className="g3">
        {[
          ['Node ID', sel.id],
          ['Status', sel.status||'offline'],
          ['Type', sel.node_type||'relay'],
          ['Device', (sel.device_type||'').replace('_',' ')||'—'],
          ['Model', sel.hardware?.model||sel.hostname||'—'],
          ['OS', sel.hardware?.os||'—'],
          ['IP Address', sel.ip_address||'—'],
          ['Location', sel.location||'—'],
          ['Agent Version', sel.agent_version||'—'],
          ['CPU Cores', sel.hardware?.cpu_cores||'—'],
          ['RAM', sel.hardware?.ram_gb?sel.hardware.ram_gb+'GB':'—'],
          ['SDR Hardware', sel.hardware?.has_sdr?(sel.hardware?.sdr_model||'detected'):'none'],
          ['Radio Enabled', sel.radio_enabled?'yes':'no'],
          ['Last Seen', sel.last_seen||'—'],
          ['MESH Earned', (sel.mesh_earned||0).toFixed(4)+' MESH'],
        ].map(([k,v])=><DR key={k} k={k} v={String(v||'—')}/>)}
      </div>
    </div>}

    {/* Register Node Modal */}
    {modal==='new'&&<Modal title="REGISTER NEW NODE" onClose={()=>setModal(null)} color={C.cyan} width={480}>
      <div className="info-box" style={{marginBottom:14}}>
        Register any device as a MeshCarrier node. A secret key will be generated — install the node agent on the device and enter this key.
      </div>
      {[['Node Name','name','e.g. Pi Node #1'],['Location','location','e.g. Brooklyn, NY']].map(([l,k,ph])=>
        <div key={k} style={{marginBottom:10}}>
          <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:4}}>{l}</div>
          <input className="inp" placeholder={ph} value={newForm[k]} onChange={e=>setNewForm(f=>({...f,[k]:e.target.value}))}/>
        </div>)}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:6}}>NODE TYPE</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {[['relay','🔗 Relay','Routes traffic, no radio'],['upf','🔀 UPF','User plane function'],['gnb','📡 gNB','Full base station (needs SDR)'],['compute','💻 Compute','Processing only']].map(([v,label,desc])=>
            <div key={v} onClick={()=>setNewForm(f=>({...f,node_type:v}))}
              style={{padding:'8px 10px',background:newForm.node_type===v?C.cyan+'20':'var(--bg3)',border:`1px solid ${newForm.node_type===v?C.cyan:C.border2}`,borderRadius:7,cursor:'pointer',flex:'1',minWidth:100}}>
              <div style={{fontSize:11,color:newForm.node_type===v?C.cyan:'var(--text)',marginBottom:2}}>{label}</div>
              <div style={{fontSize:9,color:C.muted}}>{desc}</div>
            </div>)}
        </div>
      </div>
      <div className="g2">
        <Btn full outline color={C.muted} onClick={()=>setModal(null)}>CANCEL</Btn>
        <Btn full color={C.cyan} onClick={createNode}>GENERATE KEY & REGISTER</Btn>
      </div>
    </Modal>}

    {/* Show node key modal */}
    {modal==='key'&&sel&&<Modal title="NODE KEY GENERATED" onClose={()=>{setModal(null);setSel(null);}} color={C.green} width={500}>
      <div style={{padding:'10px 13px',background:C.green+'12',border:`1px solid ${C.green}30`,borderRadius:7,marginBottom:14,fontSize:12,color:C.green}}>
        ✓ Node registered. Copy this key — it won't be shown again!
      </div>
      <div style={{marginBottom:14}}>
        <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:6}}>SECRET NODE KEY</div>
        <div style={{fontFamily:'var(--mono)',fontSize:11,background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:6,padding:'10px 12px',wordBreak:'break-all',color:C.yellow}}>{sel.node_key}</div>
      </div>
      <div style={{marginBottom:14,padding:'10px 13px',background:'var(--bg3)',borderRadius:8,fontSize:11,lineHeight:1.7}}>
        <div style={{fontWeight:700,marginBottom:6,color:C.cyan}}>Install on your device:</div>
        <div style={{fontFamily:'var(--mono)',fontSize:10,color:C.muted}}>
          # Android (Termux) or Linux / Raspberry Pi<br/>
          git clone https://github.com/meshcarrier/node-agent<br/>
          cd node-agent && cp .env.example .env<br/>
          # Edit .env: set NODE_KEY and CORE_URL<br/>
          node agent.js
        </div>
      </div>
      <Btn full color={C.green} onClick={()=>navigator.clipboard?.writeText(sel.node_key||'').then(()=>toast('Copied!'))}>COPY KEY</Btn>
    </Modal>}

    {/* Command modal */}
    {modal==='cmd'&&sel&&<Modal title="SEND COMMAND" onClose={()=>setModal(null)} color={C.yellow} width={420}>
      <div style={{display:'grid',gap:8}}>
        {[['start_upf','▶ Start UPF','Enable user plane function'],['stop_upf','⏹ Stop UPF','Disable user plane function'],['start_gnb','📡 Start gNB','Start base station (needs SDR)'],['stop_gnb','⏹ Stop gNB','Stop base station'],['reboot','↺ Reboot','Restart the node agent']].map(([type,label,desc])=>
          <div key={type} onClick={async()=>{
            try{await api('/nodes/'+sel.id+'/command',{method:'POST',body:{type}});toast('Command queued: '+type,C.green);setModal(null);}

          }} style={{padding:'10px 13px',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:7,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}>

}


function BillingMgr({show}) {
  const [status,setStatus] = useState([]);
  const [running,setRunning] = useState(false);
  const [inv,setInv] = useState(null);
  const [invSub,setInvSub] = useState(null);
  const reload=()=>api('/billing/status').then(setStatus).catch(()=>{});
  useEffect(()=>{reload();}, []);
  const runCycle=async()=>{
    setRunning(true);
    try{const r=await api('/billing/run',{method:'POST',body:{}});show(`Cycle: ${r.suspended} suspended, ${r.warned} warned, ${r.ok} ok`);reload();}
    catch(e){show(e.message,C.red);}finally{setRunning(false);}
  };
  const suspend=async s=>{try{await api('/billing/suspend/'+s.id,{method:'POST',body:{}});show('Suspended');reload();}catch(e){show(e.message,C.red);}};
  const reactivate=async s=>{try{await api('/billing/reactivate/'+s.id,{method:'POST',body:{}});show('Reactivated');reload();}catch(e){show(e.message,C.red);}};
  const loadInv=async s=>{try{const d=await api('/billing/invoice/'+s.id);setInv(d);setInvSub(s);}catch(e){show(e.message,C.red);}};
  const mrr=status.reduce((a,s)=>a+({NODE:15,MESH:30,CARRIER:55}[s.plan]||0),0);
  const BSC={current:C.green,warning:C.yellow,overdue:C.red};
  return <div>
    <div className="g5" style={{marginBottom:14}}>
      <SC label="MRR" value={'$'+mrr} color={C.green}/>
      <SC label="ARR" value={'$'+(mrr*12)} color={C.cyan}/>
      <SC label="Current" value={status.filter(s=>s.billing_status==='current').length} color={C.green}/>
      <SC label="Warning" value={status.filter(s=>s.billing_status==='warning').length} color={C.yellow}/>
      <SC label="Overdue" value={status.filter(s=>s.billing_status==='overdue').length} color={C.red}/>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:12}}>
      <Btn size="sm" color={C.blue} onClick={runCycle} disabled={running}>{running?'RUNNING…':'▶ RUN BILLING CYCLE'}</Btn>
      <Btn size="sm" outline color={C.cyan} onClick={()=>window.open(API+'/billing/export/csv','_blank')}>↓ EXPORT CSV</Btn>
    </div>
    <div className="panel tbl-wrap">
      <table><thead><tr>{['Subscriber','Plan','Last Payment','Days','Total Paid','Status','Actions'].map(h=><th key={h}>{h}</th>)}</tr></thead>
        <tbody>{status.map(s=><tr key={s.id}>
          <td><div>{s.full_name}</div><div style={{fontSize:10,color:C.muted}}>{s.email}</div></td>
          <td><Bdg label={s.plan||'—'} color={s.plan==='CARRIER'?C.yellow:s.plan==='MESH'?C.green:C.blue}/></td>
          <td style={{color:C.muted}}>{s.last_payment_date?.slice(0,10)||'Never'}</td>
          <td style={{fontFamily:'var(--mono)',color:s.days_since_payment>37?C.red:s.days_since_payment>32?C.yellow:C.text}}>{s.days_since_payment===999?'—':s.days_since_payment+'d'}</td>
          <td style={{fontFamily:'var(--mono)'}}>{s.total_paid?'$'+Number(s.total_paid).toFixed(0):'$0'}</td>
          <td><span style={{color:BSC[s.billing_status]||C.muted,fontWeight:s.billing_status!=='current'?700:400,fontSize:11}}>{s.billing_status?.toUpperCase()}</span></td>
          <td>
            <div style={{display:'flex',gap:3}}>
              <Btn size="xs" outline color={C.blue} onClick={()=>loadInv(s)}>INVOICE</Btn>
              {s.account_status!=='suspended'
                ?<Btn size="xs" outline color={C.red} onClick={()=>suspend(s)}>SUSPEND</Btn>
                :<Btn size="xs" outline color={C.green} onClick={()=>reactivate(s)}>REACTIVATE</Btn>}
            </div>
          </td>
        </tr>)}</tbody>
      </table>
    </div>
    {inv&&invSub&&<div style={{marginTop:12,background:'var(--bg2)',border:`1px solid ${C.blue}30`,borderLeft:`3px solid ${C.blue}`,borderRadius:10,padding:18}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}>
        <div><div style={{fontFamily:'var(--mono)',fontSize:12,color:C.blue,fontWeight:700}}>{inv.invoice_number}</div><div style={{fontSize:10,color:C.muted}}>{inv.period?.start} → {inv.period?.end}</div></div>
        <button type="button" onClick={()=>{setInv(null);setInvSub(null);}} style={{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:18}}>×</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
        {[['Name',inv.subscriber?.name],['Plan',inv.subscriber?.plan],['Phone',inv.subscriber?.did],['Data',`${inv.data?.used_gb}/${inv.data?.limit_gb} GB`],['Calls',`${inv.calls?.total} (${inv.calls?.total_minutes} min)`],['SMS',inv.sms?.total],['Paid',`$${(inv.summary?.total_paid_usd||0).toFixed(2)}`],['Plan Cost',`$${inv.summary?.plan_cost_usd}/mo`],['MESH',inv.summary?.mesh_balance]].map(([k,v])=>(
          <div key={k} style={{background:'var(--bg3)',borderRadius:5,padding:'8px 10px'}}>
            <div style={{fontSize:9,color:C.muted,marginBottom:2}}>{k}</div>
            <div style={{fontFamily:'var(--mono)',fontSize:10,color:C.white}}>{v}</div>
          </div>
        ))}
      </div>
    </div>}
  </div>;
}

  useEffect(()=>{load();}, []);
  return <div>
    <div style={{display:'flex',gap:10,marginBottom:16,alignItems:'flex-end',flexWrap:'wrap'}}>

              const total=Object.values(report.by_plan||{}).reduce((a,v)=>a+v,1);

                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4,fontSize:12}}>
                  <span style={{color:col,fontWeight:700,letterSpacing:1}}>{plan}</span>

                </div>
                <div className="prog-track"><div className="prog-fill" style={{width:pct+'%',background:col}}/></div>
              </div>;
            })}
          </div>
        </div>
        <div className="panel"><PH title="Subscriber Breakdown"/>
          <div style={{padding:'4px 16px 12px'}}>
            {[['Total',report.subscribers?.total,C.white],['Active',report.subscribers?.active,C.green],['NODE',report.subscribers?.byPlan?.NODE||0,C.blue],['MESH',report.subscribers?.byPlan?.MESH||0,C.green],['CARRIER',report.subscribers?.byPlan?.CARRIER||0,C.yellow]].map(([l,v,col])=>(
              <div key={l} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderBottom:'1px solid var(--border)'}}>
                <span style={{fontSize:12,color:C.text}}>{l}</span>
                <span style={{fontFamily:'var(--mono)',fontWeight:700,color:col}}>{v}</span>
              </div>

            return <div className="chart-bars">{report.by_day.map(d=><div key={d.date} className="cbar" title={`${d.date}: $${d.usd.toFixed(0)}`} style={{height:Math.max(d.usd/max*100,2)+'%',background:`linear-gradient(180deg,${C.blue},${C.cyan})`}}/> )}</div>;
          })()}

      <div className="panel tbl-wrap"><PH title={`Transactions (${report.summary?.transactions||0})`}/>
        <div style={{maxHeight:280,overflowY:'auto'}}>
          <table><thead><tr>{['Date','Subscriber','Plan','Type','XRP','USD','Status'].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{(report.transactions||[]).slice(0,50).map(p=><tr key={p.id}>
              <td style={{color:C.muted}}>{p.created_at?.slice(0,10)}</td>
              <td style={{fontSize:11}}>{p.full_name||'—'}</td>
              <td>{p.plan?<Bdg label={p.plan} color={p.plan==='CARRIER'?C.yellow:C.blue}/>:'—'}</td>
              <td><Bdg label={(p.type||'').replace(/_/g,' ')} color={C.muted}/></td>
              <td style={{fontFamily:'var(--mono)',color:C.cyan}}>{p.amount_xrp}</td>
              <td>{p.amount_usd?'$'+p.amount_usd:'—'}</td>
              <td><Dot s={p.status}/>{p.status}</td>

          </table>
        </div>
      </div>
    </div>}
  </div>;

function UsersMgr({show}) {
  const {user:me} = useAuth();
  const [users,setUsers] = useState([]);
  const [newU,setNewU] = useState(false);
  const [editU,setEditU] = useState(null);
  const [form,setForm] = useState({email:'',password:'',full_name:'',role:'user'});
  const [editF,setEditF] = useState({full_name:'',role:'',status:''});
  const reload=()=>api('/users').then(setUsers).catch(()=>{});
  useEffect(()=>{reload();}, []);
  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const create=async()=>{
    if(!form.full_name||!form.email||!form.password){show('All fields required',C.red);return;}
    try{await api('/users',{method:'POST',body:form});await reload();setNewU(false);setForm({email:'',password:'',full_name:'',role:'user'});show('User created');}
    catch(e){show(e.message,C.red);}
  };
  const saveEdit=async()=>{
    try{await api('/users/'+editU.id,{method:'PATCH',body:editF});await reload();setEditU(null);show('User updated');}
    catch(e){show(e.message,C.red);}
  };
  const toggle=async u=>{
    try{await api('/users/'+u.id,{method:'PATCH',body:{status:u.status==='active'?'suspended':'active'}});await reload();show('Status updated');}
    catch(e){show(e.message,C.red);}
  };
  const del=async u=>{
    if(!window.confirm('Delete user '+u.full_name+'? This cannot be undone.'))return;
    try{await api('/users/'+u.id,{method:'DELETE'});await reload();show('User deleted');}
    catch(e){show(e.message,C.red);}
  };
  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <span style={{fontFamily:'var(--mono)',fontSize:10,letterSpacing:2}}>SYSTEM USERS</span>
      <Btn size="sm" color={C.blue} onClick={()=>setNewU(true)} icon="＋">NEW USER</Btn>
    </div>
    <div className="panel tbl-wrap"><table>
      <thead><tr>{['Name','Email','Role','Status','Last Login','Actions'].map(h=><th key={h}>{h}</th>)}</tr></thead>
      <tbody>{users.map(u=><tr key={u.id}>
        <td style={{fontWeight:600}}>{u.full_name}</td>
        <td style={{color:C.text,fontFamily:'var(--mono)',fontSize:11}}>{u.email}</td>
        <td><Bdg label={u.role} color={ROLE_C[u.role]||C.muted}/></td>
        <td><Dot s={u.status}/>{u.status}</td>
        <td style={{color:C.muted,fontFamily:'var(--mono)',fontSize:10}}>{u.last_login?.slice(0,16)||'Never'}</td>
        <td>
          <div style={{display:'flex',gap:3}}>
            <Btn size="xs" outline color={C.blue} onClick={()=>{setEditU(u);setEditF({full_name:u.full_name,role:u.role,status:u.status});}}>EDIT</Btn>
            <Btn size="xs" outline color={u.status==='active'?C.red:C.green} onClick={()=>toggle(u)}>{u.status==='active'?'SUSP':'ACT'}</Btn>
            {me.role==='superadmin'&&u.id!==me.id&&<Btn size="xs" outline color={C.red} onClick={()=>del(u)}>DEL</Btn>}
          </div>
        </td>
      </tr>)}</tbody>
    </table></div>

    {newU&&<Modal title="CREATE USER" onClose={()=>setNewU(false)}>
      <F label="Full Name" value={form.full_name} onChange={v=>sf('full_name',v)} placeholder="Full name"/>
      <F label="Email" value={form.email} onChange={v=>sf('email',v)} type="email" placeholder="email@example.com"/>
      <F label="Password" value={form.password} onChange={v=>sf('password',v)} type="password" placeholder="Min 8 characters"/>
      <Sel label="Role" value={form.role} onChange={v=>sf('role',v)} options={[{value:'user',label:'User'},{value:'support',label:'Support'},{value:'tech',label:'Tech'},{value:'admin',label:'Admin'},{value:'superadmin',label:'Superadmin'}]}/>
      <div className="g2"><Btn full outline color={C.muted} onClick={()=>setNewU(false)}>CANCEL</Btn><Btn full color={C.blue} onClick={create}>CREATE USER</Btn></div>
    </Modal>}

    {editU&&<Modal title="EDIT USER" onClose={()=>setEditU(null)}>
      <F label="Full Name" value={editF.full_name} onChange={v=>setEditF(p=>({...p,full_name:v}))} placeholder="Full name"/>
      <Sel label="Role" value={editF.role} onChange={v=>setEditF(p=>({...p,role:v}))} options={[{value:'user',label:'User'},{value:'support',label:'Support'},{value:'tech',label:'Tech'},{value:'admin',label:'Admin'},{value:'superadmin',label:'Superadmin'}]}/>
      <Sel label="Status" value={editF.status} onChange={v=>setEditF(p=>({...p,status:v}))} options={[{value:'active',label:'Active'},{value:'suspended',label:'Suspended'}]}/>
      <div className="g2"><Btn full outline color={C.muted} onClick={()=>setEditU(null)}>CANCEL</Btn><Btn full color={C.blue} onClick={saveEdit}>SAVE CHANGES</Btn></div>
    </Modal>}
  </div>;
}

function App() {
  const [user,setUser] = useState(null);
  const [view,setView] = useState('login');
  const [checking,setChecking] = useState(true);

  useEffect(()=>{
    const tok = localStorage.getItem('mc_tok');
    if(tok){
      try{
        const payload = JSON.parse(atob(tok.split('.')[1]));
        if(payload.exp && payload.exp * 1000 > Date.now()){
          setUser({id:payload.id,email:payload.email,role:payload.role,name:payload.name||payload.full_name||payload.email});
        } else { localStorage.removeItem('mc_tok'); }
      }catch{}
    }
    setChecking(false);
  },[]);

  const logout = ()=>{ localStorage.removeItem('mc_tok'); setUser(null); setView('login'); };
  const onLogin = u=>{ setUser(u); setView('portal'); };

  const isStaff = user&&['support','tech','admin','superadmin'].includes(user.role);

    {isStaff&&<StaffPortal/>}
    {isUser&&<div id="app">

        <div className="topbar-logo">

          <span className="topbar-tag">MY PORTAL</span>
        </div>
        <div className="topbar-r">
          <div className="topbar-user">
            <span style={{fontSize:11,color:'var(--text)'}}>{user.name}</span>
            <Bdg label="user" color="#0EA5E9"/>
          </div>
          <Btn size="sm" outline color="#344F65" onClick={logout}>LOGOUT</Btn>
        </div>
      </div>
      <div className="content" style={{maxWidth:940,margin:'0 auto'}}><UserPortal/></div>
    </div>}
  </AuthCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
setTimeout(()=>{const s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(()=>s.remove(),500);}},1400);
</script>
